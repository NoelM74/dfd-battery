# Cloudflare Workers — static assets deployment for the DFD New Energy site.
# Serves the multi-page website in ./website at the root URL "/".
# Deploy with:  npx wrangler deploy
name = "dfd-battery"
compatibility_date = "2025-01-01"

[assets]
directory = "./website"
# Serve the built 404 if a path isn't found (falls back to the site's own pages otherwise).
not_found_handling = "404-page"
